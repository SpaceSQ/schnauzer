<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>研究合作 · 雪纳瑞机器人</title>
    <meta name="description" content="雪纳瑞机器人期待与机器人大脑、具身机器人、AI陪伴宠物、硅基意识与灵魂领域进行探索与研究的机构开展合作。" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <header class="hero">
        <a class="logo" href="/">
          <img class="logo-mark" src="/assets/schnauzer-mark.jpg" width="96" height="96" alt="Schnauzer Robot" style="width:96px;height:96px" />
          <div class="logo-cn" style="font-size:1.35rem">雪纳瑞机器人</div>
          <div class="logo-en">Schnauzer Robot</div>
        </a>
      </header>
      <h1 class="page-title">
        <span class="zh">研究合作</span>
        <span class="en">Research</span>
      </h1>
      <section class="card">
        <p>雪纳瑞机器人期待与机器人大脑、具身机器人、AI陪伴宠物、硅基意识与灵魂领域进行探索与研究的机构开展合作，成立联合研究实验室或者联合工作小组，就有关项目进行深度合作。雪纳瑞机器人愿意分享本项目的研究成果与进展情况。</p>
        <h2 class="form-title">合作反馈表</h2>
        <form class="feedback-form" data-mailto="xiangmiles@gmail.com" data-subject="研究合作">
          <label>
            机构
            <input name="机构" required maxlength="120" />
          </label>
          <label>
            联系人
            <input name="联系人" required maxlength="80" />
          </label>
          <label class="full">
            邮箱
            <input name="邮箱" type="email" required maxlength="120" />
          </label>
          <label class="full">
            合作方向
            <select name="合作方向" required>
              <option value="" disabled selected>请选择</option>
              <option value="机器人大脑">1、机器人大脑</option>
              <option value="具身机器人">2、具身机器人</option>
              <option value="AI陪伴宠物">3、AI陪伴宠物</option>
              <option value="硅基意识与灵魂">4、硅基意识与灵魂</option>
            </select>
          </label>
          <label class="full">
            说明
            <textarea name="说明" rows="6" maxlength="4000"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn primary">发送到 xiangmiles@gmail.com</button>
            <span class="form-status"></span>
          </div>
        </form>
      </section>
      <nav class="site-links" aria-label="机构">
        <a href="/research">研究合作</a>
        <a href="/invest">资助与投资</a>
        <a href="/about">关于我们</a>
        <a href="/contact">联系我们</a>
      </nav>
      <footer>Miles Xiang © SCR LAB © 广州雪纳瑞机器人有限公司 · 2026</footer>
    </main>
    <script src="/lang.js"></script>
    <script src="/mail-form.js"></script>
  </body>
</html>
